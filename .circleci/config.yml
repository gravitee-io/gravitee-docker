version: 2.1

parameters:
  build_java:
    type: boolean
    default: false
  build_nginx:
    type: boolean
    default: false
  build_chainguard:
    type: boolean
    default: false

orbs:
  docker: circleci/docker@2.8.2
  keeper: gravitee-io/keeper@0.6.2
  aquasec: gravitee-io/aquasec@1.0.4

commands:
  prepare-docker-context:
    steps:
      - setup_remote_docker
      - keeper/env-export:
          secret-url: keeper://cooU9UoXIk8Kj0hsP2rkBw/field/login
          var-name: DOCKER_LOGIN
      - keeper/env-export:
          secret-url: keeper://cooU9UoXIk8Kj0hsP2rkBw/field/password
          var-name: DOCKER_PASSWORD
      - docker/check

  # Context for Chainguard-based images: pull from cgr.dev, push to the private
  # Azure Container Registry (the Chainguard-derived bases are not redistributed
  # publicly on Docker Hub).
  prepare-chainguard-context:
    steps:
      - setup_remote_docker
      - keeper/env-export:
          secret-url: keeper://_2IRRQNoeeHXgGFVABh-yg/field/CHAINGUARD_LOGIN
          var-name: CHAINGUARD_LOGIN
      - keeper/env-export:
          secret-url: keeper://_2IRRQNoeeHXgGFVABh-yg/field/CHAINGUARD_PASSWORD
          var-name: CHAINGUARD_PASSWORD
      - keeper/env-export:
          secret-url: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/login
          var-name: AZURE_REGISTRY_USERNAME
      - keeper/env-export:
          secret-url: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/password
          var-name: AZURE_REGISTRY_PASSWORD
      - run:
          name: Login to Chainguard (pull) and Azure Container Registry (push)
          command: |
            printf '%s\n' "$CHAINGUARD_PASSWORD" | docker login cgr.dev --username "$CHAINGUARD_LOGIN" --password-stdin
            printf '%s\n' "$AZURE_REGISTRY_PASSWORD" | docker login graviteeio.azurecr.io --username "$AZURE_REGISTRY_USERNAME" --password-stdin

jobs:
  build-and-push-java-legacy:
    executor: docker/docker
    parameters:
      alpine_version:
        type: string
        default: ""
    steps:
      - checkout
      - prepare-docker-context
      - when :
          condition: << parameters.alpine_version >>
          steps:
            - run:
                name: Build Legacy Java alpine version << parameters.alpine_version >>
                command: |
                  docker context create tls-env
                  docker buildx create tls-env --use
                  docker buildx build \
                    --push \
                    --platform=linux/arm64,linux/amd64 \
                    --build-arg ALPINE_VERSION=<< parameters.alpine_version >> \
                    -t graviteeio/java:17-alpine-<< parameters.alpine_version >> \
                    -f images/java/Dockerfile.legacy \
                    images/java/
      - unless:
          condition: << parameters.alpine_version >>
          steps:
            - run:
                name: Build Legacy Java alpine version 17
                command: |
                  docker context create tls-env
                  docker buildx create tls-env --use
                  docker buildx build \
                    --push \
                    --platform=linux/arm64,linux/amd64 \
                    -t graviteeio/java:17 \
                    -f images/java/Dockerfile.legacy \
                    images/java/

  build-and-push-java:
    executor: docker/docker
    parameters:
      dry_run:
        description: "if true, do not push docker image"
        type: string
        default: "false"
      variant_name:
        description: "docker image variant name that will be publish"
        type: string
        default: ""
      base_image_version:
        description: "the base image variant to use from"
        type: string
        default: ""
      java_version:
        description: "java variant to use (from temurin package in debian and eclipse-temurin variant for alpine)"
        type: string
        default: ""
      graviteeio_user:
        description: "for alpine based image, set it to graviteeio and keep it empty for backward compatibility with default image"
        type: string
        default: ""
    steps:
      - checkout
      - prepare-docker-context
      - when:
          condition:
            or:
              - matches: { pattern: "^.*-alpine$", value: << parameters.variant_name >> }
                # our default java version (without specify variant == alpine)
              - matches: { pattern: "^[0-9.]+$", value: << parameters.variant_name >> }
          steps:
            - run:
                name: Build Java Alpine variant << parameters.variant_name >>
                command: |
                  docker context create tls-env
                  docker buildx create tls-env --use
                  
                  dockerArgs="--push --platform=linux/arm64,linux/amd64"
                  if [[ "<< parameters.dry_run >>" == "true" ]]
                  then
                    dockerArgs="--output=type=docker,context=tls-env"
                  fi
                  
                  docker buildx build \
                    ${dockerArgs} \
                    --build-arg JAVA_VERSION=<< parameters.java_version >> \
                    --build-arg GRAVITEEIO_USER=<< parameters.graviteeio_user >> \
                    -t graviteeio/java:<< parameters.variant_name >> \
                    -f images/java/Dockerfile.alpine \
                    images/java/
                  
                  docker run --rm -ti \
                    graviteeio/java:<< parameters.variant_name >> \
                    /bin/sh -c "id && java --version"
      - when:
          condition:
            matches: { pattern: "^.*-debian$", value: << parameters.variant_name >> }
          steps:
            - run:
                name: Build Java Debian variant << parameters.variant_name >>
                command: |
                  docker context create tls-env
                  docker buildx create tls-env --use
                  
                  dockerArgs="--push --platform=linux/arm64,linux/amd64"
                  if [[ "<< parameters.dry_run >>" == "true" ]]
                  then
                    dockerArgs="--output=type=docker,context=tls-env"
                  fi
                  
                  docker buildx build \
                    ${dockerArgs} \
                    --build-arg DEBIAN_VERSION=<< parameters.base_image_version >> \
                    --build-arg JAVA_VERSION=<< parameters.java_version >> \
                    -t graviteeio/java:<< parameters.variant_name >> \
                    -f images/java/Dockerfile.debian \
                    images/java/
                  
                  docker run --rm -ti \
                    graviteeio/java:<< parameters.variant_name >> \
                    /bin/sh -c "id && java --version"

  build-and-push-nginx:
    executor: docker/docker
    parameters:
      version:
        type: string
    steps:
      - checkout
      - prepare-docker-context
      - run:
          command: |
            docker context create tls-env
            docker buildx create tls-env --use
            docker buildx build --push --platform=linux/arm64,linux/amd64 --build-arg NGINX_VERSION=<< parameters.version >> -t graviteeio/nginx:<< parameters.version >> -f images/nginx/Dockerfile images/nginx/

  build-and-push-java-chainguard:
    executor: docker/docker
    parameters:
      chainguard_org:
        description: "Chainguard organization owning the source image"
        type: string
        default: "gravitee.io"
      java_version:
        description: "java major version (resolves the adoptium-openjdk-<v>-dev base tag)"
        type: string
        default: "21"
      chainguard_image:
        description: "Chainguard source image (adoptium-jre or adoptium-jre-fips)"
        type: enum
        enum:
          - "adoptium-jre"
          - "adoptium-jre-fips"
        default: "adoptium-jre"
      tag_suffix:
        description: "Suffix appended to the java version to form the pushed tag"
        type: string
        default: "-chainguard"
    steps:
      - checkout
      - prepare-chainguard-context
      - run:
          name: Build Java Chainguard variant << parameters.java_version >><< parameters.tag_suffix >>
          command: |
            docker context create tls-env
            docker buildx create tls-env --use
            docker buildx build \
              --push \
              --platform=linux/arm64,linux/amd64 \
              --build-arg CHAINGUARD_ORG=<< parameters.chainguard_org >> \
              --build-arg CHAINGUARD_IMAGE=<< parameters.chainguard_image >> \
              --build-arg JAVA_VERSION=<< parameters.java_version >> \
              --build-arg GRAVITEEIO_USER=graviteeio \
              -t graviteeio.azurecr.io/java:<< parameters.java_version >><< parameters.tag_suffix >> \
              -f images/java/Dockerfile.chainguard \
              images/java/

  build-and-push-nginx-chainguard:
    executor: docker/docker
    parameters:
      chainguard_org:
        description: "Chainguard organization owning the source image"
        type: string
        default: "gravitee.io"
      version:
        description: "nginx version (resolves the nginx:<version>-dev base tag)"
        type: string
        default: "1.30"
    steps:
      - checkout
      - prepare-chainguard-context
      - run:
          name: Build Nginx Chainguard variant << parameters.version >>-chainguard
          command: |
            docker context create tls-env
            docker buildx create tls-env --use
            docker buildx build \
              --push \
              --platform=linux/arm64,linux/amd64 \
              --build-arg CHAINGUARD_ORG=<< parameters.chainguard_org >> \
              --build-arg NGINX_VERSION=<< parameters.version >> \
              -t graviteeio.azurecr.io/nginx:<< parameters.version >>-chainguard \
              -f images/nginx/Dockerfile.chainguard \
              images/nginx/

  build-and-push-git-http-server:
    executor: docker/docker
    steps:
      - checkout
      - prepare-docker-context
      - docker/build:
          docker-context: images/git-http-server
          image: graviteeio/git-http-server
          path: images/git-http-server
          tag: '1.1.0'
      - docker/push:
          digest-path: /tmp/digest.txt
          image: graviteeio/git-http-server
          tag: '1.1.0'
      - run:
          command: |
            echo "Digest git-http-server image is: $(</tmp/digest.txt)"


  build-and-push-rpmsign:
    executor: docker/docker
    steps:
      - checkout
      - prepare-docker-context
      - docker/install-docker-tools
      - keeper/env-export:
          secret-url: keeper://rRi5mBfSPLl5jMvaBhqD8A/custom_field/GPG_KEY_NAME
          var-name: GPG_KEY_NAME
      - keeper/env-export:
          secret-url: keeper://rRi5mBfSPLl5jMvaBhqD8A/custom_field/GPG_KEY_PUBLIC
          var-name: GPG_KEY_PUBLIC
      - keeper/env-export:
          secret-url: keeper://rRi5mBfSPLl5jMvaBhqD8A/custom_field/GPG_KEY_PRIVATE
          var-name: GPG_KEY_PRIVATE
      - keeper/env-export:
          secret-url: keeper://rRi5mBfSPLl5jMvaBhqD8A/custom_field/GPG_KEY_PASSPHRASE
          var-name: GPG_KEY_PASSPHRASE
      - run:
          command: |
            docker context create tls-env
            docker buildx create tls-env --use
            pushd images/rpmsign > /dev/null
              docker compose build rpmsign
            
              docker compose run --rm -ti \
                -e "GPG_KEY_NAME=${GPG_KEY_NAME}" \
                -e "GPG_KEY_PUBLIC=${GPG_KEY_PUBLIC}" \
                -e "GPG_KEY_PRIVATE=${GPG_KEY_PRIVATE}" \
                -e "GPG_KEY_PASSPHRASE=${GPG_KEY_PASSPHRASE}" \
                rpmsign-test
              
              docker compose push rpmsign
            popd > /dev/null

  add-docker-images-in-aqua:
    parameters:
      docker-image-name:
        type: string
      version:
        type: string
    environment:
      DOCKER_IMAGE_NAME: << parameters.docker-image-name >>
      VERSION: << parameters.version >>
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - keeper/env-export:
          secret-url: keeper://QeHHkvALPob4pgs1hMd9Gw/custom_field/API Key
          var-name: AQUA_KEY
      - keeper/env-export:
          secret-url: keeper://QeHHkvALPob4pgs1hMd9Gw/custom_field/Secret
          var-name: AQUA_SECRET
      - keeper/env-export:
          secret-url: keeper://LYg-wdlM5UDzSqFFH6Kyig/field/login
          var-name: AQUA_USERNAME
      - keeper/env-export:
          secret-url: keeper://LYg-wdlM5UDzSqFFH6Kyig/field/password
          var-name: AQUA_PASSWORD
      - keeper/env-export:
          secret-url: keeper://QeHHkvALPob4pgs1hMd9Gw/custom_field/ScannerToken
          var-name: SCANNER_TOKEN
      - keeper/env-export:
          secret-url: keeper://TIlcGPFq4rN5GvgnZb9hng/field/password
          var-name: GITHUB_TOKEN
      - aquasec/install_billy
      - aquasec/pull_aqua_scanner_image
      - prepare-docker-context
      - aquasec/register_artifact:
          artifact_to_register: graviteeio/<< parameters.docker-image-name >>:<< parameters.version >>
          debug: false
      - aquasec/scan_docker_image:
          docker_image_to_scan: graviteeio/<< parameters.docker-image-name >>:<< parameters.version >>
          scanner_url: https://82fb8f75da.cloud.aquasec.com

workflows:
  run_every_week:
    triggers:
      - schedule:
          cron: "0 8 * * 1,4"
          filters:
            branches:
              only:
                - master
    jobs:
      # Java legacy variants
      - &build-java-legacy-320
        build-and-push-java-legacy:
          name: build java with alpine 3.20
          context: cicd-orchestrator
          alpine_version: "3.20"
      - &aqua-java-legacy-320
        add-docker-images-in-aqua:
          name: analyze java with alpine 3.20
          context: cicd-orchestrator
          requires:
            - build java with alpine 3.20
          docker-image-name: java
          version: "17-alpine-3.20"
      - &build-java-legacy-321
        build-and-push-java-legacy:
          name: build java with alpine 3.21
          context: cicd-orchestrator
          alpine_version: "3.21"
      - &aqua-java-legacy-321
        add-docker-images-in-aqua:
          name: analyze java with alpine 3.21
          context: cicd-orchestrator
          requires:
            - build java with alpine 3.21
          docker-image-name: java
          version: "17-alpine-3.21"
      - &build-java-legacy-322
        build-and-push-java-legacy:
          name: build java with alpine 3.22
          context: cicd-orchestrator
          alpine_version: "3.22"
      - &aqua-java-legacy-322
        add-docker-images-in-aqua:
          name: analyze java with alpine 3.22
          context: cicd-orchestrator
          requires:
            - build java with alpine 3.22
          docker-image-name: java
          version: "17-alpine-3.22"
      # Java 21 variants
      - &build-java-21-default
        build-and-push-java:
          name: build our default java based image (eclipse-temurin:21-jre-alpine)
          context: cicd-orchestrator
          variant_name: "21"
          java_version: "21-jre"
      - &aqua-java-21-default
        add-docker-images-in-aqua:
          name: analyze our default java based image (eclipse-temurin:21-jre-alpine)
          context: cicd-orchestrator
          requires:
            - build our default java based image (eclipse-temurin:21-jre-alpine)
          docker-image-name: java
          version: "21"
      - &build-java-21-alpine
        build-and-push-java:
          name: build java based on alpine with java 21-jre
          context: cicd-orchestrator
          variant_name: "21-alpine"
          java_version: "21-jre"
          graviteeio_user: "graviteeio"
      - &aqua-java-21-alpine
        add-docker-images-in-aqua:
          name: analyze java based on alpine with java 21-jre
          context: cicd-orchestrator
          requires:
            - build java based on alpine with java 21-jre
          docker-image-name: java
          version: "21-alpine"
      - &build-java-21-debian
        build-and-push-java:
          name: build java based on debian stable-slim and java 21-jre
          context: cicd-orchestrator
          variant_name: "21-debian"
          base_image_version: "stable-slim"
          java_version: "21-jre"
      - &aqua-java-21-debian
        add-docker-images-in-aqua:
          name: analyze java based on debian stable-slim and java 21-jre
          context: cicd-orchestrator
          requires:
            - build java based on debian stable-slim and java 21-jre
          docker-image-name: java
          version: "21-debian"
      # Java 25 variants
      - &build-java-25-default
        build-and-push-java:
          name: build our default java based image (eclipse-temurin:25-jre-alpine)
          context: cicd-orchestrator
          variant_name: "25"
          java_version: "25-jre"
      - &aqua-java-25-default
        add-docker-images-in-aqua:
          name: analyze our default java based image (eclipse-temurin:25-jre-alpine)
          context: cicd-orchestrator
          requires:
            - build our default java based image (eclipse-temurin:25-jre-alpine)
          docker-image-name: java
          version: "25"
      - &build-java-25-alpine
        build-and-push-java:
          name: build java based on alpine with java 25-jre
          context: cicd-orchestrator
          variant_name: "25-alpine"
          java_version: "25-jre"
          graviteeio_user: "graviteeio"
      - &aqua-java-25-alpine
        add-docker-images-in-aqua:
          name: analyze java based on alpine with java 25-jre
          context: cicd-orchestrator
          requires:
            - build java based on alpine with java 25-jre
          docker-image-name: java
          version: "25-alpine"
      - &build-java-25-debian
        build-and-push-java:
          name: build java based on debian stable-slim and java 25-jre
          context: cicd-orchestrator
          variant_name: "25-debian"
          base_image_version: "stable-slim"
          java_version: "25-jre"
      - &aqua-java-25-debian
        add-docker-images-in-aqua:
          name: analyze java based on debian stable-slim and java 25-jre
          context: cicd-orchestrator
          requires:
            - build java based on debian stable-slim and java 25-jre
          docker-image-name: java
          version: "25-debian"
      # Nginx variants
      - &build-nginx-129
        build-and-push-nginx:
          name: build nginx 1.29
          context: cicd-orchestrator
          version: "1.29"
      - &aqua-nginx-129
        add-docker-images-in-aqua:
          name: analyze nginx 1.29
          context: cicd-orchestrator
          requires:
            - build nginx 1.29
          docker-image-name: nginx
          version: "1.29"
      - &build-nginx-1275
        build-and-push-nginx:
          name: build nginx 1.27.5
          context: cicd-orchestrator
          version: "1.27.5"
      - &aqua-nginx-1275
        add-docker-images-in-aqua:
          name: analyze nginx 1.27.5
          context: cicd-orchestrator
          requires:
            - build nginx 1.27.5
          docker-image-name: nginx
          version: "1.27.5"
      - &build-nginx-130
        build-and-push-nginx:
          name: build nginx 1.30
          context: cicd-orchestrator
          version: "1.30"
      - &aqua-nginx-130
        add-docker-images-in-aqua:
          name: analyze nginx 1.30
          context: cicd-orchestrator
          requires:
            - build nginx 1.30
          docker-image-name: nginx
          version: "1.30"
      # Chainguard variants (Chainguard base, pushed to the private Azure registry)
      - &build-java-21-chainguard
        build-and-push-java-chainguard:
          name: build java chainguard 21
          context: cicd-orchestrator
          java_version: "21"
      - &build-java-21-chainguard-fips
        build-and-push-java-chainguard:
          name: build java chainguard fips 21
          context: cicd-orchestrator
          java_version: "21"
          chainguard_image: "adoptium-jre-fips"
          tag_suffix: "-chainguard-fips"
      - &build-nginx-130-chainguard
        build-and-push-nginx-chainguard:
          name: build nginx chainguard 1.30
          context: cicd-orchestrator
          version: "1.30"
      # Other images
      - build-and-push-git-http-server:
          name: build git-http-server
          context: cicd-orchestrator
      - add-docker-images-in-aqua:
          name: analyze git-http-server
          context: cicd-orchestrator
          requires:
            - build git-http-server
          docker-image-name: git-http-server
          version: "1.1.0"
      - build-and-push-rpmsign:
          name: build rpmsign
          context: cicd-orchestrator
      - add-docker-images-in-aqua:
          name: analyze rpmsign
          context: cicd-orchestrator
          requires:
            - build rpmsign
          docker-image-name: rpmsign
          version: "latest"

  # On-demand workflow to build all Java Docker images.
  # Trigger via CircleCI API with parameter: {"build_java": true}
  build_java_on_demand:
    when: << pipeline.parameters.build_java >>
    jobs:
      - *build-java-legacy-320
      - *aqua-java-legacy-320
      - *build-java-legacy-321
      - *aqua-java-legacy-321
      - *build-java-legacy-322
      - *aqua-java-legacy-322
      - *build-java-21-default
      - *aqua-java-21-default
      - *build-java-21-alpine
      - *aqua-java-21-alpine
      - *build-java-21-debian
      - *aqua-java-21-debian
      - *build-java-25-default
      - *aqua-java-25-default
      - *build-java-25-alpine
      - *aqua-java-25-alpine
      - *build-java-25-debian
      - *aqua-java-25-debian
      - *build-java-21-chainguard
      - *build-java-21-chainguard-fips

  # On-demand workflow to build all Nginx Docker images.
  # Trigger via CircleCI API with parameter: {"build_nginx": true}
  build_nginx_on_demand:
    when: << pipeline.parameters.build_nginx >>
    jobs:
      - *build-nginx-129
      - *aqua-nginx-129
      - *build-nginx-1275
      - *aqua-nginx-1275
      - *build-nginx-130
      - *aqua-nginx-130
      - *build-nginx-130-chainguard

  # On-demand workflow to build ONLY the Chainguard base images (pushed to the
  # private Azure registry). Trigger via CircleCI API: {"build_chainguard": true}
  build_chainguard_on_demand:
    when: << pipeline.parameters.build_chainguard >>
    jobs:
      - *build-java-21-chainguard
      - *build-java-21-chainguard-fips
      - *build-nginx-130-chainguard
